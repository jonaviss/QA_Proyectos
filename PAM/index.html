                                nombre: 'Prueba QA 002',
                                codigo: 'PAM-M05-QA02-2026',
                                fechaInicio: '19/06/2026',
                                fechaFinalizacion: '21/07/2026',
                                fechas: [
                                    { label: 'Inicio de pruebas QA (a cargo de PAM)', value: '19/06/2026' },
                                    { label: 'Fin de pruebas QA (a cargo de PAM)', value: '21/07/2026', highlight: true }
                                ],
                                responsable: 'Sandra Garcia, Alex de León, Hillary Quiroa, Ligia López, José Monterroso, Melany Sac, Valeria Salvatierra, Clara Flores',
                                estatus: 'Finalizado',
                                correcciones: { detectadas: 0, nuevosRequerimientos: 0, aAtender: 0, atendidas: 0, pendientes: 0, observacion: 'No hubo hallazgos en esta prueba. Avance al 100%, solo queda pendiente el acta de aceptación.' }
                            },
                            {
                                id: 3,
                                nombre: 'Prueba QA 003',
                                codigo: 'PAM-M05-QA03-2026',
                                fechaInicio: '18/08/2026',
                                fechaFinalizacion: '31/08/2026',
                                fechas: [
                                    { label: 'Prueba de campo — Carné y Notificaciones', value: '18/08/2026, 09:00-12:00' },
                                    { label: 'Responsable', value: 'Técnicos notificadores y Supervisores' },
                                    { label: 'Objetivo', value: 'Validar impresión, distribución de notificaciones y carnets' },
                                    { label: 'Fecha estimada de solución de pendientes', value: '31/08/2026', highlightBlue: true }
                                ],
                                responsable: 'Clara Flores, Valeria Salvatierra',
                                estatus: 'En proceso',
                                correcciones: { detectadas: 8, nuevosRequerimientos: 1, aAtender: 7, atendidas: 2, pendientes: 5, observacion: [
                                    'Impresión de carné por lotes: la funcionalidad de impresión por lotes no funcionó. En proceso, fecha estimada de solución 31/08/2026.',
                                    'Fecha y días en módulo: agregar fecha desde que el expediente está en el módulo de carnets, más los días transcurridos. Mejora post-producción.',
                                    'Notificación negativa no visible: bandeja de negativos para los notificadores. En proceso.',
                                    'Buscador por DPI en mapa: agregar buscador por DPI en el mapa, integración con Waze y copiar coordenadas. Ya solventado.',
                                    'Exportar Excel para Supervisor: habilitar el botón "Exportar en CSV para Excel" en la pestaña "Todos los expedientes" para el rol Supervisor. En proceso.',
                                    'Visualización de resoluciones: habilitar la vista de resoluciones (positiva/negativa) en la sección de Documentos y Fotos para impresión. Ya solventado, fecha estimada de solución 31/08/2026.',
                                    'Observación TS en resolución negativa: mostrar la observación registrada por el TS en la app del estudio socioeconómico en la resolución negativa. En proceso, fecha estimada de solución 31/08/2026.',
                                    'Acceso a listado de negativos: validar el acceso de Notificadores al listado de negativos para la gestión de notificaciones. En proceso, fecha estimada de solución 31/08/2026.'
                                ] }
                            }
                        ]
                    }
                ]
            }
        };

        let state = {
            indiceModuloActivo: 0,
            indicePruebaActiva: (proyectosData.qaData.modulos[0]?.pruebas.length || 1) - 1
        };

        function getEstatusColor(estatus) {
            const colors = {
                'Finalizado': 'bg-green-100 text-green-800 border-green-200',
                'En proceso': 'bg-yellow-100 text-yellow-800 border-yellow-200',
                'No iniciado': 'bg-red-100 text-red-800 border-red-200',
                'Pendiente acta de aceptación': 'bg-green-100 text-green-800 border-green-200',
                'Pruebas QA no iniciadas': 'bg-gray-100 text-gray-600 border-gray-300',
                'Pruebas de calidad QA': 'bg-yellow-100 text-yellow-800 border-yellow-200',
                'Pruebas de calidad QA en proceso': 'bg-yellow-100 text-yellow-800 border-yellow-200'
            };
            return colors[estatus] || 'bg-gray-100 text-gray-800 border-gray-200';
        }

        function getEstatusIcon(estatus) {
            const icons = {
                'Finalizado': 'check-circle-2',
                'En proceso': 'clock',
                'No iniciado': 'alert-circle',
                'Pendiente acta de aceptación': 'file-signature',
                'Pruebas QA no iniciadas': 'circle-dashed',
                'Pruebas de calidad QA': 'search-check',
                'Pruebas de calidad QA en proceso': 'search-check'
            };
            return icons[estatus] || 'help-circle';
        }

        function cambiarModulo(index) {
            state.indiceModuloActivo = index;
            const pruebas = proyectosData.qaData.modulos[index]?.pruebas || [];
            state.indicePruebaActiva = pruebas.length > 0 ? pruebas.length - 1 : 0;
            render();
        }

        function cambiarPrueba(index) {
            state.indicePruebaActiva = index;
            render();
        }

        function render() {
            const moduloActivo = proyectosData.qaData.modulos[state.indiceModuloActivo];
            const listaPruebas = moduloActivo?.pruebas || [];
            const pruebaActiva = listaPruebas[state.indicePruebaActiva] || null;

            const avancePrueba = pruebaActiva && pruebaActiva.correcciones && pruebaActiva.correcciones.aAtender > 0
                ? Math.round((pruebaActiva.correcciones.atendidas / pruebaActiva.correcciones.aAtender) * 100)
                : (pruebaActiva?.estatus === 'Finalizado' ? 100 : 0);

            let html = `
                <nav class="bg-white border-b border-gray-200 px-6 py-2 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-gray-800 hidden sm:block">Control QA Proyectos</span>
                    </div>
                    <div class="flex items-center space-x-3 bg-gray-50 px-4 py-2 rounded-full border border-gray-200">
                        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                    </div>
                </nav>

                <div class="bg-[#0a2e5c] pt-2 pb-4 px-6 lg:px-12">
                    <div class="max-w-7xl mx-auto"></div>
                </div>

                <div class="max-w-full mx-auto px-4 lg:px-6 -mt-2 pb-4">
                    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                        <div class="bg-white border-b border-gray-100 p-3 sm:px-6 flex flex-col gap-2">
                            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800">
                                        Programa de Aporte Económico del Adulto Mayor (PAM)
                                    </h2>
                                </div>
                                <div class="flex items-center px-4 py-2 rounded-full border-2 font-bold ${getEstatusColor(moduloActivo?.estatusModulo || proyectosData.qaData.estatusGeneral)}">
                                    <i data-lucide="${getEstatusIcon(moduloActivo?.estatusModulo || proyectosData.qaData.estatusGeneral)}" class="w-5 h-5 mr-2"></i>
                                    <span class="uppercase text-xs">${moduloActivo?.estatusModulo || proyectosData.qaData.estatusGeneral}</span>
                                </div>
                            </div>
                        </div>

                        <div class="p-3 sm:p-4 bg-gray-50/50">
                            <div class="mb-3 bg-white p-2.5 rounded-2xl shadow-sm border border-gray-200">
                                <p class="text-[10px] font-bold text-gray-400 uppercase mb-3">Módulos del Sistema en Revisión</p>
                                <div class="flex flex-wrap items-start gap-2">
                                    ${proyectosData.qaData.modulos.map((mod, index) => `
                                        <button onclick="cambiarModulo(${index})" class="px-4 py-2.5 rounded-xl font-bold text-sm transition-all border flex flex-col items-start gap-1.5 ${index === state.indiceModuloActivo ? 'bg-[#0a2e5c] text-white border-[#0a2e5c] shadow-lg scale-105' : (mod.estatusModulo === 'Pendiente acta de aceptación' ? 'bg-green-50 text-green-800 border-green-200 hover:bg-green-100' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50')}">
                                            <span class="flex items-center">
                                                ${mod.nombre}
                                                ${mod.pruebas.length > 0 ? `<span class="ml-2 px-1.5 py-0.5 rounded-full text-[10px] ${index === state.indiceModuloActivo ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-400'}">${mod.pruebas.length}</span>` : ''}
                                            </span>
                                            ${mod.estatusModulo ? `
                                                <span class="inline-flex items-center px-2 py-0.5 rounded-full border text-[9px] font-black uppercase ${index === state.indiceModuloActivo ? 'bg-white/10 text-white border-white/30' : getEstatusColor(mod.estatusModulo)}">
                                                    <i data-lucide="${getEstatusIcon(mod.estatusModulo)}" class="w-2.5 h-2.5 mr-1"></i> ${mod.estatusModulo}
                                                </span>
                                            ` : ''}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            ${moduloActivo && moduloActivo.infoAdicional ? `
                                <div class="mb-6 bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                    <p class="text-[11px] font-black text-gray-400 uppercase mb-3 flex items-center">
                                        <i data-lucide="list-checks" class="w-4 h-4 mr-2"></i> ${moduloActivo.infoAdicional.titulo}
                                    </p>
                                    ${moduloActivo.infoAdicional.pruebasInternas ? `
                                        <div class="flex items-center gap-3 mb-4 bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3 w-fit">
                                            <span class="text-2xl font-black text-indigo-700">${moduloActivo.infoAdicional.pruebasInternas.toLocaleString('es-GT')}</span>
                                            <span class="text-xs font-bold text-indigo-600 uppercase">${moduloActivo.infoAdicional.etiqueta}</span>
                                        </div>
                                    ` : ''}
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        ${moduloActivo.infoAdicional.secciones.map((sec, si) => `
                                            <div class="border border-gray-100 rounded-xl p-4">
                                                <p class="text-sm font-bold text-gray-700 mb-2">${si + 1}. ${sec.titulo}</p>
                                                <ul class="space-y-1">
                                                    ${sec.items.map(it => `<li class="text-sm text-gray-600 flex items-start"><i data-lucide="minus" class="w-3.5 h-3.5 mr-2 mt-0.5 text-blue-400 shrink-0"></i>${it}</li>`).join('')}
                                                </ul>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            ${listaPruebas.length > 0 ? `
                                <div class="flex flex-wrap gap-2 mb-3 border-b border-gray-200 pb-2">
                                    ${listaPruebas.map((p, index) => `
                                        <button onclick="cambiarPrueba(${index})" class="px-4 py-2 rounded-lg font-bold text-xs transition-all border uppercase tracking-tighter ${index === state.indicePruebaActiva ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-400 border-gray-200 hover:bg-gray-50'}">
                                            ${p.nombre}
                                        </button>
                                    `).join('')}
                                </div>
                            ` : ''}

                            ${pruebaActiva && !pruebaActiva.isPlaceholder ? `
                                <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 mb-3 animate-fade-in">
                                    <div class="lg:col-span-2 bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-start">
                                            <div>
                                                <div>
                                                    <p class="text-xs text-gray-400 mb-1 font-bold uppercase">Código de la Prueba</p>
                                                    <p class="text-lg font-bold text-gray-800 flex items-center">
                                                        <i data-lucide="activity" class="w-5 h-5 mr-2 text-blue-500"></i> ${pruebaActiva.codigo}
                                                    </p>
                                                    ${pruebaActiva.componentes ? `
                                                        <div class="flex gap-2 mt-2">
                                                            ${pruebaActiva.componentes.map(c => `<span class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 text-[10px] font-black uppercase">${c}</span>`).join('')}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                                <div class="mt-4">
                                                    <div class="inline-flex items-center px-3 py-1 rounded-full border text-[10px] font-black ${getEstatusColor(pruebaActiva.estatus)}">
                                                        <i data-lucide="${getEstatusIcon(pruebaActiva.estatus)}" class="w-3 h-3 mr-1"></i>
                                                        <span class="uppercase">${pruebaActiva.estatus}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-400 mb-2 font-bold uppercase">Responsables Institucionales</p>
                                                ${pruebaActiva.responsable ? `
                                                    <table class="w-full text-sm border border-gray-100 rounded-lg overflow-hidden">
                                                        <thead>
                                                            <tr class="bg-gray-50 text-gray-400 text-[10px] uppercase font-bold">
                                                                <th class="px-3 py-2 text-left w-10">#</th>
                                                                <th class="px-3 py-2 text-left">Nombre</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            ${pruebaActiva.responsable.split(/[,/]/).map((r, i) => `
                                                                <tr class="border-t border-gray-100">
                                                                    <td class="px-3 py-2 text-gray-400 font-bold">${i + 1}</td>
                                                                    <td class="px-3 py-2 text-gray-800 font-semibold">${r.trim()}</td>
                                                                </tr>
                                                            `).join('')}
                                                        </tbody>
                                                    </table>
                                                ` : `<p class="text-sm text-gray-400 italic">Pendiente de definir</p>`}
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-gray-50 mt-6">
                                            ${(pruebaActiva.fechas || []).map(f => {
                                                if (f.highlight) {
                                                    return `<div class="bg-green-50 px-4 py-3 rounded-xl border border-green-200 shadow-sm"><p class="text-[10px] text-green-700 mb-1 font-black uppercase leading-tight">${f.label}</p><p class="text-sm font-black text-green-800 flex items-center"><i data-lucide="check-circle" class="w-4 h-4 mr-2 text-green-600 shrink-0"></i> ${f.value}</p></div>`;
                                                }
                                                if (f.highlightBlue) {
                                                    return `<div class="bg-blue-50 px-4 py-3 rounded-xl border border-blue-200 shadow-sm"><p class="text-[10px] text-blue-700 mb-1 font-black uppercase leading-tight">${f.label}</p><p class="text-sm font-black text-blue-800 flex items-center"><i data-lucide="info" class="w-4 h-4 mr-2 text-blue-600 shrink-0"></i> ${f.value}</p></div>`;
                                                }
                                                return `<div class="px-2 py-1"><p class="text-[10px] text-gray-400 mb-1 font-bold uppercase leading-tight">${f.label}</p><p class="text-sm font-bold text-gray-700 flex items-center"><i data-lucide="calendar" class="w-4 h-4 mr-2 text-blue-400 shrink-0"></i> ${f.value}</p></div>`;
                                            }).join('')}
                                        </div>
                                        ${pruebaActiva.notaGrande ? `

                                                <p class="text-xl font-black text-orange-800 leading-tight">${pruebaActiva.notaGrande}</p>
                                            </div>
                                        ` : ''}

                                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col justify-center items-center">

                                        <div class="relative w-36 h-36 flex justify-center items-center">
                                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                                <circle cx="18" cy="18" r="16" fill="none" stroke="#f3f4f6" stroke-width="3"></circle>
                                                <circle cx="18" cy="18" r="16" fill="none" stroke="${pruebaActiva.estatus === 'Finalizado' ? '#22c55e' : '#2563eb'}" stroke-width="3" stroke-dasharray="${avancePrueba}, 100" stroke-linecap="round" class="progress-ring-circle"></circle>
                                            </svg>
                                            <div class="absolute flex flex-col items-center justify-center">
                                                <span class="text-4xl font-black text-gray-800 leading-none">${avancePrueba}<span class="text-lg">%</span></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <h3 class="text-sm font-black text-gray-400 uppercase mb-2 flex items-center">
                                    <i data-lucide="activity" class="w-4 h-4 mr-2"></i> Control de Hallazgos y Correcciones
                                </h3>

                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
                                    ${[
                                        { label: 'correcciones a atender por DISI', value: pruebaActiva.correcciones.aAtender, color: 'bg-cyan-50 border-cyan-200 text-cyan-700 ring-1 ring-cyan-100', icon: 'clipboard-list', desc: 'Total de correcciones que DISI debe resolver en esta prueba.' },
                                        { label: 'correcciones atendidas por DISI', value: pruebaActiva.correcciones.atendidas, color: 'bg-green-50 border-green-100 text-green-600', icon: 'wrench', desc: 'Correcciones que ya fueron resueltas por DISI.' },
                                        { label: 'nuevos requerimientos', value: pruebaActiva.correcciones.nuevosRequerimientos, color: 'bg-indigo-50 border-indigo-100 text-indigo-600', icon: 'file-plus', desc: 'Solicitudes adicionales identificadas durante las pruebas, distintas a correcciones.' },
                                        { label: 'total de correcciones detectadas en QA', value: pruebaActiva.correcciones.detectadas, color: 'bg-red-50 border-red-100 text-red-600', icon: 'bug', desc: 'Total de hallazgos identificados durante el proceso de QA.' }
                                    ].map(stat => `
                                        <div class="group relative rounded-2xl p-4 border flex flex-col justify-between transition-all hover:shadow-md hover:-translate-y-1 cursor-default ${stat.color}">
                                            <div class="flex justify-between items-start mb-2">
                                                <p class="text-[10px] font-black uppercase leading-tight">${stat.label}</p>
                                                <i data-lucide="${stat.icon}" class="w-4 h-4 opacity-70"></i>
                                            </div>
                                            <p class="text-3xl font-black">${stat.value}</p>
                                            <div class="pointer-events-none absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-56 bg-gray-900 text-white text-xs font-medium rounded-lg px-3 py-2 opacity-0 group-hover:opacity-100 transition-opacity z-10 shadow-lg">
                                                ${stat.desc}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="rounded-2xl p-4 border ${pruebaActiva.correcciones.pendientes > 0 ? 'bg-orange-50 border-orange-200' : 'bg-green-50 border-green-200'}">
                                    <div class="flex items-start">
                                        <div class="mt-1 mr-4">
                                            <i data-lucide="${pruebaActiva.correcciones.pendientes > 0 ? 'alert-circle' : 'check-circle-2'}" class="w-6 h-6 ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-500' : 'text-green-500'}"></i>
                                        </div>
                                        <div class="flex-1">
                                            <h4 class="text-xs font-black uppercase tracking-widest mb-2 ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-800' : 'text-green-800'}">Observaciones y Estatus de Hallazgos</h4>
                                            ${Array.isArray(pruebaActiva.correcciones.observacion) ? `
                                                <ol class="list-decimal list-inside space-y-1 text-sm leading-relaxed font-medium ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-900' : 'text-green-900'}">
                                                    ${pruebaActiva.correcciones.observacion.map(o => `<li>${o}</li>`).join('')}
                                                </ol>
                                            ` : `
                                                <p class="text-sm leading-relaxed font-medium ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-900' : 'text-green-900'}">${pruebaActiva.correcciones.observacion}</p>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            ` : `
                                <div class="bg-white rounded-3xl p-16 border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-center">
                                    <div class="bg-gray-50 p-6 rounded-full mb-6">
                                        <i data-lucide="clipboard-check" class="w-12 h-12 text-gray-300"></i>
                                    </div>
                                    <p class="text-gray-500 text-lg font-bold max-w-md mx-auto leading-relaxed">
                                        Faltan las pruebas con la migración de datos.
                                    </p>
                                </div>
                            `}
                        </div>
                    </div>
                </div>

            `;

            document.getElementById('app').innerHTML = html;

            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        render();
    </script>
</body>
</html>
