                'No iniciado': 'bg-red-100 text-red-800 border-red-200',
                'Pendiente acta de aceptación': 'bg-green-100 text-green-800 border-green-200',
                'Pruebas QA no iniciadas': 'bg-gray-100 text-gray-600 border-gray-300',
                'Pruebas de calidad QA': 'bg-yellow-100 text-yellow-800 border-yellow-200',
                'Pruebas de calidad QA en proceso': 'bg-yellow-100 text-yellow-800 border-yellow-200'
            };
            return colors[estatus] || 'bg-gray-100 text-gray-800 border-gray-200';
        }

        function getEstatusIcon(estatus) {
            const icons = {
                'Finalizado': 'check-circle-2',
                'En proceso': 'clock',
                'No iniciado': 'alert-circle',
                'Pendiente acta de aceptación': 'file-signature',
                'Pruebas QA no iniciadas': 'circle-dashed',
                'Pruebas de calidad QA': 'search-check',
                'Pruebas de calidad QA en proceso': 'search-check'
            };
            return icons[estatus] || 'help-circle';
        }

            state.indiceModuloActivo = index;
            state.indicePruebaActiva = 0;

                                                    <div class="inline-flex items-center px-3 py-1 rounded-full border text-[10px] font-black ${getEstatusColor(pruebaActiva.estatus)}">
                                                        <i data-lucide="${getEstatusIcon(pruebaActiva.estatus)}" class="w-3 h-3 mr-1"></i>
                                                        <span class="uppercase">${pruebaActiva.estatus}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-400 mb-2 font-bold uppercase">Responsables Institucionales</p>
                                                ${pruebaActiva.responsable ? `
                                                    <table class="w-full text-sm border border-gray-100 rounded-lg overflow-hidden">
                                                        <thead>
                                                            <tr class="bg-gray-50 text-gray-400 text-[10px] uppercase font-bold">
                                                                <th class="px-3 py-2 text-left w-10">#</th>
                                                                <th class="px-3 py-2 text-left">Nombre</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            ${pruebaActiva.responsable.split(/[,/]/).map((r, i) => `
                                                                <tr class="border-t border-gray-100">
                                                                    <td class="px-3 py-2 text-gray-400 font-bold">${i + 1}</td>
                                                                    <td class="px-3 py-2 text-gray-800 font-semibold">${r.trim()}</td>
                                                                </tr>
                                                            `).join('')}
                                                        </tbody>
                                                    </table>
                                                ` : `<p class="text-sm text-gray-400 italic">Pendiente de definir</p>`}
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-gray-50 mt-6">
                                            ${(pruebaActiva.fechas || []).map(f => {
                                                if (f.highlight) {
                                                    return `<div class="bg-green-50 px-4 py-3 rounded-xl border border-green-200 shadow-sm"><p class="text-[10px] text-green-700 mb-1 font-black uppercase leading-tight">${f.label}</p><p class="text-sm font-black text-green-800 flex items-center"><i data-lucide="check-circle" class="w-4 h-4 mr-2 text-green-600 shrink-0"></i> ${f.value}</p></div>`;
                                                }
                                                if (f.highlightBlue) {
                                                    return `<div class="bg-blue-50 px-4 py-3 rounded-xl border border-blue-200 shadow-sm"><p class="text-[10px] text-blue-700 mb-1 font-black uppercase leading-tight">${f.label}</p><p class="text-sm font-black text-blue-800 flex items-center"><i data-lucide="info" class="w-4 h-4 mr-2 text-blue-600 shrink-0"></i> ${f.value}</p></div>`;
                                                }
                                                return `<div class="px-2 py-1"><p class="text-[10px] text-gray-400 mb-1 font-bold uppercase leading-tight">${f.label}</p><p class="text-sm font-bold text-gray-700 flex items-center"><i data-lucide="calendar" class="w-4 h-4 mr-2 text-blue-400 shrink-0"></i> ${f.value}</p></div>`;
                                            }).join('')}
                                        </div>
                                        ${pruebaActiva.notaGrande ? `
                                            <div class="mt-6 bg-orange-50 border-2 border-orange-200 rounded-xl px-5 py-4 flex items-center">
                                                <i data-lucide="file-signature" class="w-7 h-7 mr-3 text-orange-500 shrink-0"></i>
                                                <p class="text-xl font-black text-orange-800 leading-tight">${pruebaActiva.notaGrande}</p>
                                            </div>
                                        ` : ''}
                                    </div>

                                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col justify-center items-center">
                                        <p class="text-[11px] text-gray-400 font-bold uppercase mb-4 w-full text-center">Avance en atención de correcciones por DISI</p>
                                        <div class="relative w-36 h-36 flex justify-center items-center">
                                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                                <circle cx="18" cy="18" r="16" fill="none" stroke="#f3f4f6" stroke-width="3"></circle>
                                                <circle cx="18" cy="18" r="16" fill="none" stroke="${pruebaActiva.estatus === 'Finalizado' ? '#22c55e' : '#2563eb'}" stroke-width="3" stroke-dasharray="${avancePrueba}, 100" stroke-linecap="round" class="progress-ring-circle"></circle>
                                            </svg>
                                            <div class="absolute flex flex-col items-center justify-center">
                                                <span class="text-4xl font-black text-gray-800 leading-none">${avancePrueba}<span class="text-lg">%</span></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <h3 class="text-sm font-black text-gray-400 uppercase mb-2 flex items-center">
                                    <i data-lucide="activity" class="w-4 h-4 mr-2"></i> Control de Hallazgos y Correcciones
                                </h3>

                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
                                    ${[
                                        { label: 'correcciones a atender por DISI', value: pruebaActiva.correcciones.aAtender, color: 'bg-cyan-50 border-cyan-200 text-cyan-700 ring-1 ring-cyan-100', icon: 'clipboard-list', desc: 'Total de correcciones que DISI debe resolver en esta prueba.' },
                                        { label: 'correcciones atendidas por DISI', value: pruebaActiva.correcciones.atendidas, color: 'bg-green-50 border-green-100 text-green-600', icon: 'wrench', desc: 'Correcciones que ya fueron resueltas por DISI.' },
                                        { label: 'nuevos requerimientos', value: pruebaActiva.correcciones.nuevosRequerimientos, color: 'bg-indigo-50 border-indigo-100 text-indigo-600', icon: 'file-plus', desc: 'Solicitudes adicionales identificadas durante las pruebas, distintas a correcciones.' },
                                        { label: 'total de correcciones detectadas en QA', value: pruebaActiva.correcciones.detectadas, color: 'bg-red-50 border-red-100 text-red-600', icon: 'bug', desc: 'Total de hallazgos identificados durante el proceso de QA.' }
                                    ].map(stat => `
                                        <div class="group relative rounded-2xl p-4 border flex flex-col justify-between transition-all hover:shadow-md hover:-translate-y-1 cursor-default ${stat.color}">
                                            <div class="flex justify-between items-start mb-2">
                                                <p class="text-[10px] font-black uppercase leading-tight">${stat.label}</p>
                                                <i data-lucide="${stat.icon}" class="w-4 h-4 opacity-70"></i>
                                            </div>
                                            <p class="text-3xl font-black">${stat.value}</p>
                                            <div class="pointer-events-none absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-56 bg-gray-900 text-white text-xs font-medium rounded-lg px-3 py-2 opacity-0 group-hover:opacity-100 transition-opacity z-10 shadow-lg">
                                                ${stat.desc}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="rounded-2xl p-4 border ${pruebaActiva.correcciones.pendientes > 0 ? 'bg-orange-50 border-orange-200' : 'bg-green-50 border-green-200'}">
                                    <div class="flex items-start">
                                        <div class="mt-1 mr-4">
                                            <i data-lucide="${pruebaActiva.correcciones.pendientes > 0 ? 'alert-circle' : 'check-circle-2'}" class="w-6 h-6 ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-500' : 'text-green-500'}"></i>
                                        </div>
                                        <div class="flex-1">
                                            <h4 class="text-xs font-black uppercase tracking-widest mb-2 ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-800' : 'text-green-800'}">Observaciones y Estatus de Hallazgos</h4>
                                            ${Array.isArray(pruebaActiva.correcciones.observacion) ? `
                                                <ol class="list-decimal list-inside space-y-1 text-sm leading-relaxed font-medium ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-900' : 'text-green-900'}">
                                                    ${pruebaActiva.correcciones.observacion.map(o => `<li>${o}</li>`).join('')}
                                                </ol>
                                            ` : `
                                                <p class="text-sm leading-relaxed font-medium ${pruebaActiva.correcciones.pendientes > 0 ? 'text-orange-900' : 'text-green-900'}">${pruebaActiva.correcciones.observacion}</p>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            ` : `
                                <div class="bg-white rounded-3xl p-16 border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-center">
                                    <div class="bg-gray-50 p-6 rounded-full mb-6">
                                        <i data-lucide="clipboard-check" class="w-12 h-12 text-gray-300"></i>
                                    </div>
                                    <p class="text-gray-500 text-lg font-bold max-w-md mx-auto leading-relaxed">
                                        Faltan las pruebas con la migración de datos.
                                    </p>
                                </div>
                            `}
                        </div>
                    </div>
                </div>

                <footer class="max-w-full mx-auto px-4 py-3 text-center border-t border-gray-200 mt-3">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                        Sistema de Control de Calidad Institucional &copy; 2026 - Acceso Restringido | Visualización para ${proyectosData.enteRector}
                    </p>
                </footer>
            `;

            document.getElementById('app').innerHTML = html;
            
            // Inicializar iconos de Lucide después de renderizar
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // Inicializar la aplicación
        render();
    </script>
</body>
</html>
